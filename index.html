<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESL Energy</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2a1f'/%3E%3Crect x='7' y='10' width='16' height='12' rx='2' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Crect x='24' y='14' width='2' height='4' rx='1' fill='%2334d399'/%3E%3Crect x='10' y='13' width='10' height='6' rx='1' fill='%2334d399'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
    :root { --bg: #f1f7f3; --text: #0f2a1f; --akzent: #15803d; --glow: rgba(21,128,61,.18); color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #07140e; --text: #e6f4ec; --akzent: #34d399; --glow: rgba(52,211,153,.22); color-scheme: dark; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: radial-gradient(60vmax 60vmax at 50% 45%, var(--glow), transparent 70%), var(--bg); color: var(--text); font-family: "Archivo", system-ui, sans-serif; }
    .marke { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; padding: 1rem; }
    svg { width: clamp(96px, 22vw, 150px); height: auto; color: var(--akzent); }
    h1 { margin: 0; font-weight: 800; font-stretch: 118%; font-size: clamp(2.4rem, 9vw, 4.5rem); letter-spacing: -0.02em; }
    .zelle { fill: currentColor; opacity: .15; animation: laden 3.2s infinite; }
    .zelle:nth-of-type(2) { animation-delay: .4s; } .zelle:nth-of-type(3) { animation-delay: .8s; } .zelle:nth-of-type(4) { animation-delay: 1.2s; }
    @keyframes laden { 0%, 10% { opacity: .15; } 30%, 80% { opacity: 1; } 100% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .zelle { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <main class="marke">
    <svg viewBox="0 0 120 64" role="img" aria-label="Akku">
      <rect x="3" y="3" width="104" height="58" rx="10" fill="none" stroke="currentColor" stroke-width="5"/>
      <rect x="109" y="22" width="8" height="20" rx="3" fill="currentColor"/>
      <rect class="zelle" x="13" y="13" width="18" height="38" rx="3"/>
      <rect class="zelle" x="35" y="13" width="18" height="38" rx="3"/>
      <rect class="zelle" x="57" y="13" width="18" height="38" rx="3"/>
      <rect class="zelle" x="79" y="13" width="18" height="38" rx="3"/>
    </svg>
    <h1>ESL Energy</h1>
  </main>
</body>
</html>
